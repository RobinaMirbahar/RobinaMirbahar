name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=RobinaMirbahar&layout=donut-vertical&langs_count=8&hide_border=true&bg_color=00000000&title_color=38bdf8&text_color=cbd5e1&size_weight=0.5&count_weight=0.5&exclude_repo=RobinaMirbahar&hide=html,css&border_radius=12
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify no error SVGs before committing
        run: |
          if grep -q "Something went wrong" profile/*.svg; then
            echo "Detected error in generated SVG; reverting broken SVG files."
            git checkout -- profile/*.svg
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
